<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .my-form {
            background-color: white;
            max-width: 400px; 
            width: 100%;
            padding: 30px;
            border-radius: 12px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); 
            box-sizing: border-box;
        }

        .my-form h2 {
            text-align: center;
            margin-top: 0;
            color: #333;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #f9f9fc;
            box-sizing: border-box;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #6e8efb;
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        #error-msg {
            color: #d9534f;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }
        
        #success-msg {
            color: #5cb85c;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="my-form">
        <h2>Registration Form</h2>

        <div id="error-msg"></div>
        <div id="success-msg"></div>

        <form id="registrationForm" onsubmit="return validateForm(event)">
            
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" pattern="[0-9]{10}" title="Please enter exactly 10 digits" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" required>
                    <option value="">--Select--</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">Address:</label>
                <textarea id="address" required></textarea>
            </div>

            <div class="form-group">
                <label for="pass">Password:</label>
                <input type="password" id="pass" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="cpass">Confirm Password:</label>
                <input type="password" id="cpass" required>
            </div>

            <input type="submit" value="Submit" class="submit-btn">
            
        </form>
    </div>

    <script>
        function validateForm(event) {
            event.preventDefault(); 

            const pass = document.getElementById("pass").value;
            const cpass = document.getElementById("cpass").value;
            const errorText = document.getElementById("error-msg");
            const successText = document.getElementById("success-msg");

            errorText.innerHTML = "";
            successText.innerHTML = "";

            if (pass !== cpass) {
                errorText.innerHTML = "Error: Passwords do not match!";
                return false;
            }

            successText.innerHTML = "Registration Successful!";
            document.getElementById("registrationForm").reset();
        }
    </script>

</body>
</html>
